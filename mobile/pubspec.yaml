publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  intl: ^0.19.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
